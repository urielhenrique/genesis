app:
  storage:
    receipts-path: uploads/receipts

spring:
  application:
    name: genesis-backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    url: jdbc:postgresql://localhost:5432/genesis
    username: postgres
    password: LSsnMG74ZXYMmj

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: genesis
        format_sql: true

  flyway:
    enabled: true
    default-schema: genesis
    schemas: genesis
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger
  api-docs:
    path: /api-docs
